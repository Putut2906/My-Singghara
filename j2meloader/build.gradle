plugins {
    id 'com.android.library'
}

android {
    compileSdk 36
    ndkVersion '29.0.14206865'
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        minSdk 24
        buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
        buildConfigField 'String', 'VERSION_NAME', '"1.8.2"'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
        resValues true
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
        abortOnError false
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }
}

dependencies {
    implementation project(':dexlib')

    def roomVersion = '2.8.5'
    def cameraxVersion = '1.6.2'
    def autoServiceVersion = '1.1.1'

    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.2-android'

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'io.github.nikita36078:ffmpeg-kit:6.0.LTS'
    implementation 'com.google.oboe:oboe:1.11.0'

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    implementation 'com.github.nikita36078:filepicker:4.3.0'
    api 'com.github.yukuku:ambilwarna:2.0.1'

    implementation 'ch.acra:acra-dialog:5.14.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    def kotlinMetadataVersion = '2.4.21'
    annotationProcessor "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlinMetadataVersion"
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
}
