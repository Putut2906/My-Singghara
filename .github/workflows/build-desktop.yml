# Membangun aplikasi PC "My Singghara Desktop" langsung dari repo ini (My-Singghara),
# memakai modul desktop mandiri di folder /desktop (proyek Gradle terpisah, TIDAK di-include
# ke build Android sehingga tidak memengaruhi APK). Menghasilkan Windows .exe/.msi + portabel,
# macOS .dmg, Linux .deb, lalu menerbitkan GitHub Release ber-tag "desktop-v<run_number>".
name: Build Desktop PC

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis eksplisit, mis. v1.0.216 (kosong = pakai 1.0.<run> / nama tag)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/example/web/**'
      - 'app/src/main/assets/web/**'

permissions:
  contents: write

jobs:
  package:
    name: Paket ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tasks: packageExe packageMsi
            artifact_path: |
              desktop/build/compose/binaries/main/exe/*.exe
              desktop/build/compose/binaries/main/msi/*.msi
          - name: macOS
            os: macos-latest
            tasks: packageDmg
            artifact_path: desktop/build/compose/binaries/main/dmg/*.dmg
          - name: Linux
            os: ubuntu-latest
            tasks: packageDeb
            artifact_path: desktop/build/compose/binaries/main/deb/*.deb
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tentukan versi aplikasi (tag > input dispatch > run_number)
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"; v="${v#v}"
          else
            v="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
          echo "Versi aplikasi desktop: $v"

      - name: Diag audit kurung CatApi
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          OUT="$("$PY" - <<'PYEOF'
          import hashlib
          p = "src/main/kotlin/desktop/server/CatApi.kt"
          b = open(p, "rb").read()
          print("SHA256", hashlib.sha256(b).hexdigest(), "BYTES", len(b))
          s = b.decode("utf-8"); i=0; n=len(s); line=1; brace=0; first0=None
          ins=sc=lc=esc=False
          while i<n:
              c=s[i]; nx=s[i+1] if i+1<n else ""
              if c=="\n": line+=1; lc=False; i+=1; continue
              if lc: i+=1; continue
              if sc:
                  if c=="*" and nx=="/": sc=False; i+=2; continue
                  i+=1; continue
              if ins:
                  if esc: esc=False
                  elif c=="\\": esc=True
                  elif c=='"': ins=False
                  i+=1; continue
              if c=="/" and nx=="/": lc=True; i+=2; continue
              if c=="/" and nx=="*": sc=True; i+=2; continue
              if c=='"': ins=True; i+=1; continue
              if c=="{": brace+=1
              elif c=="}":
                  brace-=1
                  if brace==0 and line>61 and first0 is None: first0=line
              i+=1
          print("FINAL_BRACE", brace, "FIRST_ZERO_LINE", first0)
          PYEOF
          )"
          echo "$OUT"
          echo "::warning::DIAG $(echo "$OUT" | tr '\n' ' ')"

      # Windows: versi portabel dulu (tanpa WiX) supaya launcher .exe tetap ada walau installer gagal.
      - name: Build versi portabel (Windows)
        if: matrix.name == 'Windows'
        run: ./gradlew createDistributable -PappVersionName=${{ steps.ver.outputs.app_version }} --no-daemon --stacktrace 2>&1 | tee /tmp/desk-build.log; exit "${PIPESTATUS[0]}"

      - name: Unggah versi portabel (Windows)
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: my-singghara-desktop-Windows-portable
          path: desktop/build/compose/binaries/main/app/
          if-no-files-found: error

      - name: Build installer
        run: ./gradlew ${{ matrix.tasks }} -PappVersionName=${{ steps.ver.outputs.app_version }} --no-daemon --stacktrace 2>&1 | tee -a /tmp/desk-build.log; exit "${PIPESTATUS[0]}"

      - name: Tampilkan error kompilasi / ekor log bila build gagal
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          LOG=/tmp/desk-build.log
          if [ -f "$LOG" ]; then
            # Baris error kompilator Kotlin / Gradle -> jadikan annotation agar terlihat tanpa buka log mentah.
            grep -nE "^e: |error:|FAILURE:|What went wrong|Compilation error|Unresolved reference" "$LOG" | head -n 40 | sed 's/^/::error::/'
            echo "--- 40 baris terakhir mentah ---"; tail -n 40 "$LOG"
          else
            echo "::error::Log build tidak ditemukan."
          fi
          # Tambahkan ekor log jpackage bila ada (untuk kegagalan packaging installer).
          JP="$(find . -path '*/compose/logs/*' -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$JP" ]; then echo "Log jpackage: $JP"; tail -n 30 "$JP"; fi

      - name: Unggah artefak installer
        uses: actions/upload-artifact@v4
        with:
          name: my-singghara-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Terbitkan Release PC
    needs: package
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unduh semua artefak desktop
        uses: actions/download-artifact@v4
        with:
          pattern: my-singghara-desktop-*
          path: dl
          merge-multiple: false

      - name: Tentukan tag & nama rilis
        id: vars
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="desktop-v${{ github.run_number }}"
          fi
          case "$TAG" in v1.0.*) NAME="My Singghara $TAG" ;; *) NAME="My Singghara Desktop $TAG" ;; esac
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Rakit aset rilis (installer + portable zip)
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag_name }}"
          mkdir -p release-assets
          find dl -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.deb' -o -iname '*.dmg' \) \
            -not -path '*/My Singghara/*' \
            -exec cp -v {} release-assets/ \;
          PORT_DIR="$(find dl -type d -name 'My Singghara' | head -n 1 || true)"
          if [ -n "$PORT_DIR" ]; then
            ( cd "$(dirname "$PORT_DIR")" && zip -rq "$GITHUB_WORKSPACE/release-assets/MySingghara-${TAG}-Windows-portable.zip" "$(basename "$PORT_DIR")" )
          fi
          echo "=== Isi release-assets ==="; ls -lh release-assets/

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body: |
            ## 🖥️ ${{ steps.vars.outputs.release_name }}
            Dibangun langsung dari repo My-Singghara (modul /desktop) via GitHub Actions.
            Windows .exe/.msi + portabel, macOS .dmg, Linux .deb. Semua belum ditandatangani (unsigned).
            - **Commit**: `${{ steps.vars.outputs.short_sha }}` · **Run**: `${{ github.run_number }}`
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
